name: update schedule

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Забрать расписание с портала
        run: python3 build.py

      - name: Проверить границу подписки
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 check_subscription.py

      - name: Закоммитить, если изменилось
        run: |
          if git diff --quiet -- schedule.ics; then
            echo "изменений нет"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add schedule.ics
          git commit -m "расписание на $(date -u +%Y-%m-%d)"
          git push
